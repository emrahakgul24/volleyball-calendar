name: probe
on:
  push:
    branches: [probe]
    paths: [probe/urls.txt]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          mkdir -p probe/out
          rm -f probe/out/*
          i=0
          while read -r url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            name=$(printf '%02d' $i)_$(echo "$url" | sed 's#https\?://##; s#[^A-Za-z0-9._-]#_#g' | cut -c1-80)
            curl -sSL --compressed --max-time 60 -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36" \
              -H "Accept-Language: tr-TR,tr;q=0.9,en;q=0.8" \
              -D "probe/out/$name.headers" -o "probe/out/$name.body" "$url" || echo "FAIL $url" >> probe/out/failures.txt
            echo "$url -> $name $(stat -c%s probe/out/$name.body 2>/dev/null)" >> probe/out/index.txt
          done < probe/urls.txt
      - name: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add probe/out
          git commit -m "probe results [skip ci]" || exit 0
          git push
